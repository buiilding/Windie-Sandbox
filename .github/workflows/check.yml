name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release notes
        run: scripts/check-release-notes.sh

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation links and guide completeness
        run: scripts/check-docs.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/windie-inspector/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Inspector submodule
        working-directory: .
        run: git submodule update --init --depth 1 vendor/windie-inspector
      - uses: actions/setup-node@v4
        with:
          node-version-file: vendor/windie-inspector/frontend/.nvmrc
          cache: npm
          cache-dependency-path: vendor/windie-inspector/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
      - run: cargo fmt --check
      - run: cargo check --target x86_64-pc-windows-msvc
      - run: cargo test --target x86_64-pc-windows-msvc
