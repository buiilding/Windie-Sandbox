name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Windie submodules
        run: git submodule update --init --depth 1 vendor/bifrost vendor/windie-inspector
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/windie-inspector/frontend/package-lock.json
      - name: Restore Bifrost build
        uses: actions/cache@v4
        with:
          path: vendor/bifrost/tmp
          key: bifrost-v2-${{ runner.os }}-${{ matrix.target }}-go1.26.5-${{ hashFiles('vendor/bifrost/**', '!vendor/bifrost/.git', '!vendor/bifrost/.git/**', '!vendor/bifrost/tmp/**', '!vendor/bifrost/ui/node_modules/**', '!vendor/bifrost/ui/dist/**', '!vendor/bifrost/go.work', '!vendor/bifrost/go.work.sum') }}
      - name: Restore Inspector build
        uses: actions/cache@v4
        with:
          path: target/${{ matrix.target }}/release/windie-inspector*
          key: inspector-v3-${{ runner.os }}-${{ matrix.target }}-rust-stable-${{ hashFiles('vendor/windie-inspector/host/Cargo.toml', 'vendor/windie-inspector/host/Cargo.lock', 'vendor/windie-inspector/host/src/**', 'vendor/windie-inspector/frontend/**', '!vendor/windie-inspector/frontend/node_modules/**', '!vendor/windie-inspector/frontend/build/**') }}
      - name: Package release
        env:
          WINDIE_REUSE_BIFROST: "1"
          WINDIE_REUSE_INSPECTOR: "1"
        run: scripts/package-release.sh "${{ matrix.target }}" "${{ matrix.label }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: windie-${{ matrix.label }}
          path: dist/*

  package-windows:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Windie submodules
        run: git submodule update --init --depth 1 vendor/bifrost vendor/windie-inspector
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/windie-inspector/frontend/package-lock.json
      - name: Restore Bifrost build
        uses: actions/cache@v4
        with:
          path: vendor/bifrost/tmp
          key: bifrost-v2-${{ runner.os }}-${{ matrix.target }}-go1.26.5-${{ hashFiles('vendor/bifrost/**', '!vendor/bifrost/.git', '!vendor/bifrost/.git/**', '!vendor/bifrost/tmp/**', '!vendor/bifrost/ui/node_modules/**', '!vendor/bifrost/ui/dist/**', '!vendor/bifrost/go.work', '!vendor/bifrost/go.work.sum') }}
      - name: Restore Inspector build
        uses: actions/cache@v4
        with:
          path: target/${{ matrix.target }}/release/windie-inspector*
          key: inspector-v3-${{ runner.os }}-${{ matrix.target }}-rust-stable-${{ hashFiles('vendor/windie-inspector/host/Cargo.toml', 'vendor/windie-inspector/host/Cargo.lock', 'vendor/windie-inspector/host/src/**', 'vendor/windie-inspector/frontend/**', '!vendor/windie-inspector/frontend/node_modules/**', '!vendor/windie-inspector/frontend/build/**') }}
      - name: Package Windows release
        shell: pwsh
        env:
          WINDIE_REUSE_BIFROST: "1"
          WINDIE_REUSE_INSPECTOR: "1"
        run: ./scripts/package-release.ps1 ${{ matrix.target }} ${{ matrix.label }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: windie-${{ matrix.label }}
          path: dist/*

  publish:
    needs: [package, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate release notes
        run: scripts/check-release-notes.sh
      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' RELEASE_NOTES.md > release-notes.md
          test -s release-notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
